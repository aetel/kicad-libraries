name: Build and publish KiCad PCM package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest PCM indexes from main
        run: |
          git fetch origin main

          git show origin/main:pcm/packages.json > pcm/packages.json
          git show origin/main:pcm/repository.json > pcm/repository.json

      - name: Build package and update PCM indexes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          python3 scripts/package.py "$VERSION" \
            --status testing \
            --kicad-version 10.0

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              build/aetel-kicad-addon.zip \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              build/aetel-kicad-addon.zip \
              --title "AETEL KiCad Libraries ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi

      - name: Save updated PCM indexes
        run: |
          mkdir -p "$RUNNER_TEMP/aetel-pcm"
          cp pcm/packages.json "$RUNNER_TEMP/aetel-pcm/"
          cp pcm/repository.json "$RUNNER_TEMP/aetel-pcm/"

      - name: Commit PCM indexes to main
        run: |
          git fetch origin main
          git switch -C main origin/main

          cp "$RUNNER_TEMP/aetel-pcm/packages.json" pcm/packages.json
          cp "$RUNNER_TEMP/aetel-pcm/repository.json" pcm/repository.json

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add pcm/packages.json pcm/repository.json

          if git diff --cached --quiet; then
            echo "No PCM index changes."
          else
            git commit -m "Update PCM indexes for ${GITHUB_REF_NAME}"
            git push origin main
          fi

